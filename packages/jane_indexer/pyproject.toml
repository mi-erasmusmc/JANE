[project]
name = "jane-indexer"
version = "0.1.0"
description = "JANE indexer (heavy box): build the Tantivy index from PubMed.sqlite + journal metadata, upload to S3."
requires-python = ">=3.12"
dependencies = [
    "jane-core",
    "tantivy>=0.22",
    "boto3>=1.34",
    "httpx>=0.27",
    "lxml>=5",
    "zstandard>=0.22",
]

[project.scripts]
jane-index = "jane_indexer.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jane_indexer"]

[tool.uv.sources]
jane-core = { workspace = true }
