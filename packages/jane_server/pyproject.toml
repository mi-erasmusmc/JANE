[project]
name = "jane-server"
version = "0.1.0"
description = "JANE server (lightweight box): FastAPI web UI + REST + MCP over a local Tantivy index."
requires-python = ">=3.12"
dependencies = [
    "jane-core",
    "tantivy>=0.22",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "mcp>=1.2",
    "boto3>=1.34",
    "zstandard>=0.22",
    "slowapi>=0.1.9",
    "pydantic-settings>=2.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jane_server"]

[tool.uv.sources]
jane-core = { workspace = true }
