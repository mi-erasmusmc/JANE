[project]
name = "jane-core"
version = "0.1.0"
description = "Shared JANE search core: analyzer, Tantivy schema, MoreLikeThis, SearchService, models."
requires-python = ">=3.12"
dependencies = [
    "tantivy>=0.22",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jane_core"]
